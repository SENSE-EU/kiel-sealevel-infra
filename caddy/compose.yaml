services:
  caddy:
    image: caddy:2
    container_name: caddy-rp
    restart: unless-stopped

    environment:
      ACME_EMAIL: ${ACME_EMAIL}

    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - myapp_caddy_data:/data
      - myapp_caddy_config:/config

    networks:
      - staging_proxy
      - preprod_proxy


volumes:
  myapp_caddy_data:
    external: true

  myapp_caddy_config:
    external: true


networks:
  staging_proxy:
    external: true
    name: kiel-sealevel_staging_proxy

  preprod_proxy:
    external: true
    name: kiel-sealevel_preprod_proxy

