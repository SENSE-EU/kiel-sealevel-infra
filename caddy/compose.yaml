services:
  caddy:
    image: caddy:2
    container_name: myapp-caddy
    restart: unless-stopped

#    environment:

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - staging_proxy
      - preprod_proxy
