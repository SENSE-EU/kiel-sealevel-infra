      DATABASE_PASSWORD: ${PREPROD_DB_PASSWORD}
      DATABASE_SSL: "false"

      APP_KEYS: ${PREPROD_APP_KEYS}
      API_TOKEN_SALT: ${PREPROD_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${PREPROD_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${PREPROD_TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${PREPROD_JWT_SECRET}

    volumes:
      - preprod_cms_uploads:/opt/app/public/uploads

    depends_on:
      postgres-preprod:
